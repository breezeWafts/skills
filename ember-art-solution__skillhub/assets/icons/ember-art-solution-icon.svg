<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
  <pattern id="paperGrain" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.6" fill="#1C1C1C" opacity="0.035"/>
    <circle cx="4" cy="3" r="0.5" fill="#1C1C1C" opacity="0.028"/>
    <circle cx="2.5" cy="5" r="0.45" fill="#1C1C1C" opacity="0.03"/>
  </pattern>
    <clipPath id="card"><rect x="24" y="24" width="464" height="464" rx="104"/></clipPath>
  </defs>
  <!-- 美学总控：三环交叠＝东方/西方/伊斯兰三体系汇于一境，环心留白为「间」，三行短横＝多场景交付，朱砂单点破格 -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#FAF8F3"/>
  <g clip-path="url(#card)">
    <rect x="24" y="24" width="464" height="464" fill="url(#paperGrain)"/>
    <g fill="none" stroke="#2E4A6B" stroke-linecap="round">
      <circle cx="340" cy="170" r="188" stroke-width="2.4" stroke-opacity="0.1"/>
      <circle cx="340" cy="170" r="152" stroke-width="2.4" stroke-opacity="0.14"/>
      <circle cx="340" cy="170" r="116" stroke-width="2.4" stroke-opacity="0.18"/>
    </g>
    <g fill="none" stroke="#2E4A6B" stroke-width="5" stroke-opacity="0.9">
      <circle cx="236" cy="194" r="54"/>
      <circle cx="197" cy="262" r="54"/>
      <circle cx="275" cy="262" r="54"/>
    </g>
    <circle cx="236" cy="240" r="19" fill="#FAF8F3"/>
    <circle cx="236" cy="240" r="7" fill="#1C1C1C"/>
    <g fill="#2E4A6B" opacity="0.85">
      <rect x="96" y="352" width="110" height="12" rx="6"/>
      <rect x="96" y="386" width="158" height="12" rx="6"/>
      <rect x="96" y="420" width="84" height="12" rx="6"/>
    </g>
    <circle cx="392" cy="150" r="10" fill="#B03A2E"/>
  </g>
</svg>
