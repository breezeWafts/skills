<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="34" height="34" role="img" aria-labelledby="ember-title ember-desc" style="--icon-bg:#FAF8F3;--icon-edge:rgba(28,28,28,0.06);--icon-ink:#526883;--icon-cut:#FAF8F3;--icon-card:#1C1C1C;--accent-ha:#B5483A;--icon-stroke:1.5;--icon-radius:20px;">
  <title id="ember-title">Ember Reader - L1</title>
